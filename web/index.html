<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hatua</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
<!--
  Hatua on the web: one website for administrators, community health workers and
  caregivers. The same account signs in here and in the phone app, and the login decides
  which pages are shown. Plain HTML, CSS and JavaScript (no build step), served by the
  backend at /web and talking to the same API as the app.
-->
<!-- Saved light or dark choice, applied before anything draws (see app.js). -->
<script>try { const t = localStorage.getItem('hatua.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (_) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=block">
<!-- Bump ?v= when style.css or app.js change, so browsers do not keep an old copy. -->
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<header id="top" hidden>
  <a class="brand" href="#" id="brand"></a>
  <nav id="nav"></nav>
  <div class="who"><span class="name" id="who"></span> <span id="theme"></span> <button id="signout" class="second small">Sign out</button></div>
</header>
<div id="hero"></div>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<!-- Swahili words (from i18n/sw.json), needed before app.js makes any text. -->
<script src="/i18n/sw.js"></script>
<script src="app.js?v=15"></script>
</body>
</html>
