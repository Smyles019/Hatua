name: hatua
description: Hatua, developmental risk checks for children under five (caregiver, CHW and admin app).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0" # Flutter 3.24 or newer

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  google_sign_in: ^7.1.0
  http: ^1.2.2
  intl: ">=0.19.0 <0.21.0"
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    # Swahili lines, copied from i18n/sw.json by i18n/tools/sync_app.py.
    - assets/i18n/
